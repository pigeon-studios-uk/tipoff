# The shared checks (version, CHANGELOG, README links, secrets) and release jobs:
# https://gitlab.com/pigeon-studios/tools/ci-templates
include:
  - project: pigeon-studios/tools/ci-templates
    ref: v1.4.1
    file:
      - templates/checks.yml
      - templates/release.yml

# free: once a tag passes and its GitHub release is out, publish to the registry and GitHub Discussions.
variables:
  PS_RELEASE_KIND: free

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# What counts as a change to the bot. A push that only changes docs, the README, the changelog or the brand artwork
# runs only the shared checks. Running a pipeline by hand (CI/CD -> Pipelines -> Run pipeline) always runs everything.
.bot-files: &bot-files
  - "**/*.{js,mjs,cjs,json}"
  - "scripts/**/*"
  - ".gitlab-ci.yml"

# The tests use a real database, as on the server: the oldest and newest MariaDB worth supporting, and MySQL 8.4 (what
# self-hosted copies on Railway and similar hosts use).
test:
  stage: test
  image: node:24-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG
    - changes: *bot-files
  parallel:
    matrix:
      - DB_IMAGE: ["mariadb:10.6", "mariadb:11.4", "mysql:8.4"]
  services:
    - name: ${DB_IMAGE}
      alias: mariadb
  variables:
    MARIADB_DATABASE: tipoff_test
    MARIADB_USER: tipoff_test
    MARIADB_PASSWORD: tipoff_test
    MARIADB_ROOT_PASSWORD: tipoff_root
    MYSQL_DATABASE: tipoff_test
    MYSQL_PASSWORD: tipoff_test
    MYSQL_ROOT_PASSWORD: tipoff_root
    MYSQL_HOST: mariadb
    MYSQL_PORT: "3306"
    MYSQL_USER: tipoff_test
    MYSQL_PASS: tipoff_test
    MYSQL_DB: tipoff_test
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - npm ci --no-audit --no-fund
    - npm test
    - for file in $(git ls-files '*.js'); do node --check "$file" || exit 1; done
