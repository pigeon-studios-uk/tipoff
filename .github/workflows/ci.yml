name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mariadb:10.6', 'mariadb:11.4', 'mysql:8.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_DATABASE: tipoff_test
          MARIADB_USER: tipoff_test
          MARIADB_PASSWORD: tipoff_test
          MARIADB_ROOT_PASSWORD: tipoff_root
          MYSQL_DATABASE: tipoff_test
          MYSQL_USER: tipoff_test
          MYSQL_PASSWORD: tipoff_test
          MYSQL_ROOT_PASSWORD: tipoff_root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptipoff_root || healthcheck.sh --connect"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: tipoff_test
      MYSQL_PASS: tipoff_test
      MYSQL_DB: tipoff_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Every file parses
        run: for file in $(git ls-files '*.js'); do node --check "$file" || exit 1; done

      - name: package.json version matches the latest changelog entry
        run: |
          pkg=$(node -p "require('./package.json').version")
          changelog=$(grep -oP '^## \[\K[0-9][^]]*' CHANGELOG.md | head -1)
          echo "package.json: $pkg  CHANGELOG.md: $changelog"
          [ "$pkg" = "$changelog" ]

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t tipoff .
      - name: The image has Node.js 24 and loads its settings
        run: docker run --rm -e DISCORD_TOKEN=x tipoff node -e "const c = require('./services/config'); if (!process.version.startsWith('v24')) process.exit(1); console.log(c.name, c.version)"
